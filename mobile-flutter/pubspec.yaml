name: mahalflow_mobile
description: "MahalFlow — Fintech Community & Dues Management Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.5.0+1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.3.7
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  open_filex: ^4.5.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  payu_checkoutpro_flutter: ^1.4.5
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# App launcher icon (Android + iOS + web). Uses the white-on-teal MahalFlow mark.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D4F43"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

# Splash screen: teal background with the MahalFlow mark, light + dark.
flutter_native_splash:
  color: "#0D4F43"
  image: "assets/icon/app_splash.png"
  android: true
  ios: false
  web: false
  android_12:
    color: "#0D4F43"
    image: "assets/icon/app_splash.png"
  color_dark: "#0D4F43"
  image_dark: "assets/icon/app_splash.png"
