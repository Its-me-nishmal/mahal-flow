<div class="mb-6">
<h2 class="font-page-title text-page-title text-on-surface">Make a Contribution</h2>
<p class="font-body text-body text-text-secondary mt-1">Support community initiatives outside of regular dues.</p>
</div>
<!-- Contribution Form Card -->
<div class="bg-surface rounded-xl border border-border-base p-5 shadow-[0_2px_8px_rgba(23,32,29,0.04)]">
<!-- Amount Input -->
<div class="mb-6">
<label class="block font-card-title text-card-title text-on-surface mb-2" for="contribution-amount">Amount</label>
<div class="relative flex items-center h-[56px] rounded-lg border border-outline-variant bg-surface focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all duration-200 overflow-hidden">
<div class="pl-4 pr-1 text-text-secondary font-amount-lg text-amount-lg flex items-center h-full select-none">
                        ₹
                    </div>
<input class="w-full h-full bg-transparent border-none focus:ring-0 font-amount-lg text-amount-lg text-on-surface placeholder:text-text-muted pb-1" id="contribution-amount" placeholder="1,000" type="number"/>
</div>
</div>
<!-- Optional Note -->
<div class="mb-8">
<label class="block font-card-title text-card-title text-on-surface mb-2 flex items-center justify-between" for="contribution-note">
<span>Note <span class="text-text-secondary font-body text-body font-normal">(Optional)</span></span>
</label>
<textarea class="w-full rounded-lg border border-outline-variant bg-surface p-3 font-body text-body text-on-surface placeholder:text-text-muted focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 resize-none" id="contribution-note" placeholder="Add a message or specify the purpose..." rows="3"></textarea>
</div>

<button class="w-full h-12 bg-primary-container text-on-primary font-button text-button rounded-lg flex items-center justify-center transition-all duration-200 hover:bg-surface-tint active:scale-[0.98] shadow-sm">
                Continue to Payment
            </button>
<div class="mt-4 flex items-center justify-center text-text-secondary gap-1.5">
