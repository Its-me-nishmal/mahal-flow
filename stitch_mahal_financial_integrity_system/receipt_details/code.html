<style>

<body class="bg-bg-app text-text-primary font-body antialiased selection:bg-primary-container selection:text-on-primary">
<!-- TopAppBar (Suppressed navigation, focus on content return) -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-on-background flat no shadows transition-colors duration-200">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/50 dark:hover:bg-surface-variant/10 text-primary dark:text-primary-fixed">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-page-title text-page-title text-primary dark:text-primary-fixed">Receipt</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 pb-24 px-margin-mobile md:px-margin-desktop max-w-2xl mx-auto w-full min-h-screen flex flex-col items-center">
<!-- Receipt Card -->
<div class="bg-surface w-full rounded-xl border border-border-base shadow-[0_2px_8px_rgba(23,32,29,0.08)] overflow-hidden flex flex-col relative mt-4">
<!-- Receipt Header / Branding -->
<div class="p-lg flex flex-col items-center text-center pb-md">
<div class="w-16 h-16 bg-success-bg rounded-full flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-success" data-icon="check_circle" style="font-size: 32px; font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-card-title text-card-title text-text-primary">Payment Successful</h2>
<p class="font-amount-lg text-amount-lg text-text-primary mt-sm">₹1,500</p>
<p class="font-small text-small text-text-secondary mt-xs">15 Aug 2026 • 10:24 AM</p>
</div>
<!-- Receipt Details -->
<div class="px-lg py-md dashed-border-y bg-surface-bright flex flex-col gap-md">
<div class="flex justify-between items-start">
<span class="font-small text-small text-text-secondary">Receipt Number</span>
<span class="font-body text-body text-text-primary text-right font-semibold">GV1MH00120260803R00002</span>
</div>
<div class="flex justify-between items-start">
<span class="font-small text-small text-text-secondary">Member Name</span>
<span class="font-body text-body text-text-primary text-right">Muhammed</span>
</div>
<div class="flex justify-between items-start">
<span class="font-small text-small text-text-secondary">Payment Type</span>
<span class="font-body text-body text-text-primary text-right">Monthly Dues</span>
</div>
<div class="flex justify-between items-start">
<span class="font-small text-small text-text-secondary">Months Covered</span>
<span class="font-body text-body text-text-primary text-right">Jun, Jul, Aug 2026</span>
</div>
<div class="flex justify-between items-start">
<span class="font-small text-small text-text-secondary">Payment Method</span>
<span class="font-body text-body text-text-primary text-right">UPI</span>
</div>
</div>
<!-- Receipt Footer / Organization Info -->
<div class="p-lg flex flex-col items-center text-center">
<h3 class="font-section-title text-section-title text-primary-container mb-xs">MahalFlow</h3>
<p class="font-small text-small text-text-secondary max-w-[200px]">Thank you for your contribution. This is a computer-generated receipt.</p>
</div>
<!-- Decorative cutouts for authentic receipt feel -->
<div class="absolute left-[-12px] top-[180px] w-6 h-6 bg-bg-app rounded-full border-r border-border-base"></div>
<div class="absolute right-[-12px] top-[180px] w-6 h-6 bg-bg-app rounded-full border-l border-border-base"></div>
</div>
<!-- Action Buttons -->
<div class="w-full mt-xl flex flex-col gap-md">
<button class="w-full h-12 bg-primary-container text-on-primary font-button text-button rounded-lg flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150 shadow-[0_2px_8px_rgba(23,32,29,0.08)]">
<span class="material-symbols-outlined" data-icon="download">download</span>
                Download PDF
            </button>
<button class="w-full h-12 bg-surface border border-primary-container text-primary-container font-button text-button rounded-lg flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="share">share</span>
                Share Receipt
            </button>
</div>
