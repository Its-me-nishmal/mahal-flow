<style>

        /* Custom Input Styles overriding Tailwind Forms plugin slightly to match design system */
        .ds-input {
            border-radius: 10px;
            border-color: #E3E8E6;
            min-height: 48px;
        }

            border-color: #146c5b;

<body class="bg-bg-app text-text-primary font-body text-body antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim border-b border-border-base dark:border-outline-variant flex items-center justify-between px-margin-mobile w-full h-14 sticky top-0 z-10">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-tertiary-container transition-colors active:opacity-80 transition-opacity p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-page-title text-page-title text-primary dark:text-primary-fixed flex-1 text-center pr-8">Edit Profile</h1>
</header>
<main class="flex-1 flex flex-col px-margin-mobile py-lg pb-xxl max-w-2xl mx-auto w-full">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center justify-center mb-xl">
<div class="relative">
<div class="w-24 h-24 rounded-full overflow-hidden border-2 border-surface shadow-sm bg-surface-container-high">
<img alt="Profile Picture" class="w-full h-full object-cover" data-alt="A professional headshot of a middle-aged South Asian man named Muhammed, looking friendly and approachable. The image is brightly lit with a clean, light-grey background, adhering to a modern corporate aesthetic. The colors are muted and professional, focusing on clear facial features and a subtle smile. High-quality corporate portrait photography style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDutd0BzNfCQL_3KBaGvwGK1AfFWNjPHakVraJbCm8mbcb5jP_b6ASD-4D2_X3Hum6YmAe1tfmWqJ_xt27UXYILJKR0eOpzfY8DaQY-Er12FLWUQ3HfkbydrxwQlubD6nQuYpanObzIK_lEXknzlnUGXYV0LMuVK2I8L8nSM6OXg532T4gkhY3veC5S4E9-aY0YIbN4NMj3hut2eWBWnFK-Q58nAE6rMue-meFdrz5Wm9bXw3FYp4kO"/>
</div>
<button aria-label="Edit Profile Picture" class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-2 rounded-full shadow-md hover:opacity-90 active:scale-95 transition-all flex items-center justify-center border-2 border-surface">
<span class="material-symbols-outlined text-[16px]" data-icon="edit">edit</span>
</button>
</div>
</section>
<!-- Form Section -->
<form class="space-y-gutter flex-1 flex flex-col">
<!-- Full Name -->
<div class="flex flex-col space-y-xs">
<label class="font-small text-small text-text-secondary" for="fullName">Full Name</label>
<input class="ds-input w-full bg-surface text-text-primary px-4 py-2 border border-border-base focus:ring-0 focus:border-primary-container transition-colors" id="fullName" placeholder="Enter full name" type="text" value="Muhammed"/>
</div>
<!-- Mobile Number (Verified) -->
<div class="flex flex-col space-y-xs relative">
<label class="font-small text-small text-text-secondary" for="mobile">Mobile Number</label>
<div class="relative">
<input class="ds-input w-full bg-surface-container-low text-text-muted px-4 py-2 border border-border-base pr-24 cursor-not-allowed" disabled="" id="mobile" placeholder="Enter mobile number" type="tel" value="+91 98765 43210"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center bg-success-bg text-success px-2 py-1 rounded-md">
<span class="material-symbols-outlined icon-filled text-[14px] mr-1" data-icon="check_circle">check_circle</span>
<span class="font-small text-small font-semibold">Verified</span>
</div>
</div>
<p class="font-small text-small text-text-muted mt-1">To change your verified mobile number, contact the admin.</p>
</div>
<!-- Email -->
<div class="flex flex-col space-y-xs">
<label class="font-small text-small text-text-secondary" for="email">Email Address</label>
<input class="ds-input w-full bg-surface text-text-primary px-4 py-2 border border-border-base focus:ring-0 focus:border-primary-container transition-colors" id="email" placeholder="Enter email address" type="email" value="muhammed@example.com"/>
</div>
<!-- Address (Multi-line) -->
<div class="flex flex-col space-y-xs">
<label class="font-small text-small text-text-secondary" for="address">Address</label>
<textarea class="ds-input w-full bg-surface text-text-primary px-4 py-3 border border-border-base focus:ring-0 focus:border-primary-container transition-colors resize-none" id="address" placeholder="Enter full address" rows="3">123, Palm Grove, Kerala, India</textarea>
</div>
<!-- Spacer to push button to bottom on tall screens -->
<div class="flex-1 min-h-[32px]"></div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary font-button text-button h-12 rounded-[10px] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center shadow-sm mt-8" type="button">
                Save Changes
            </button>
</form>
</main>
<!-- Bottom Nav is suppressed on this 'focused journey / specific edit' screen based on semantic mapping rules (not a top level destination) -->
</body></html>
