<body class="bg-bg-app text-text-primary min-h-screen flex flex-col font-body">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background fixed top-0 w-full z-50 border-b border-border-base dark:border-outline-variant flat no shadows transition-colors duration-200">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-text-secondary hover:bg-surface-variant/50 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-page-title text-page-title text-text-primary">Alert Details</h1>
</div>
<button class="text-text-secondary hover:bg-surface-variant/50 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined">help_outline</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-24 pb-xxl px-margin-mobile md:px-margin-desktop max-w-screen-md mx-auto w-full">
<!-- Alert Card -->
<article class="bg-surface rounded-xl border border-border-base p-lg shadow-[0_2px_8px_rgba(23,32,29,0.08)] mb-lg relative overflow-hidden">
<!-- Decorative accent line -->
<div class="absolute top-0 left-0 w-full h-1 bg-warning"></div>
<header class="mb-lg">
<div class="flex justify-between items-start mb-sm">
<span class="inline-flex items-center gap-xs bg-warning-bg text-warning font-small text-small px-2 py-1 rounded-full">
<span class="material-symbols-outlined text-[16px]">info</span>
                        Payment Due
                    </span>
<time class="font-small text-small text-text-muted">2 hours ago</time>
</div>
<h2 class="font-section-title text-section-title text-text-primary">Monthly Subscription Due</h2>
</header>
<div class="mb-xl bg-bg-app rounded-lg p-md border border-border-base">
<div class="flex flex-col items-center justify-center py-sm">
<span class="font-small text-small text-text-secondary mb-xs">Amount Due</span>
<span class="font-amount-lg text-amount-lg text-primary">₹1,500</span>
</div>
<div class="w-full h-[1px] bg-border-base my-md"></div>
<div class="flex justify-between items-center">
<span class="font-body text-body text-text-secondary">Due Date</span>
<span class="font-body text-body text-text-primary font-semibold">Oct 15, 2023</span>
</div>

</div>
<div class="mb-xl">
<p class="font-body text-body text-text-secondary leading-relaxed">Your monthly subscription payment is due soon. Please ensure payment is made by the due date. If you have already made the payment, it may take up to 24 hours to reflect in your account.</p>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-md mt-xl pt-lg border-t border-border-base">
<button class="flex-1 bg-primary-container text-on-primary font-button text-button h-12 rounded-lg hover:bg-surface-tint transition-colors duration-200 flex items-center justify-center gap-sm">
                    Pay ₹1,500
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
<div class="flex flex-1 gap-md">
<button class="flex-1 bg-surface border border-primary-container text-primary-container font-button text-button h-12 rounded-lg hover:bg-surface-container-low transition-colors duration-200">
                        Remind Me
                    </button>
<button class="flex-1 bg-surface border border-border-base text-text-secondary font-button text-button h-12 rounded-lg hover:bg-surface-container-low transition-colors duration-200">
                        Dismiss
                    </button>
</div>
</div>
</article>
</main>
